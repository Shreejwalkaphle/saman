# The application-context test must be hermetic: it must not read or mutate the
# developer's PostgreSQL database and must not require a running Redis container.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:saman_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false

app.jwt.secret=dGVzdC1vbmx5LWp3dC1zaWduaW5nLXNlY3JldC0zMi1ieXRlcy1taW5pbXVt
app.bootstrap.admin-email=
app.bootstrap.admin-password=
app.upload.dir=${java.io.tmpdir}/saman-test-uploads
app.cors.allowed-origins=http://localhost:4200
app.payment.esewa.product-code=EPAYTEST
app.payment.esewa.secret-key=test-secret-key
app.payment.esewa.form-url=https://example.test/esewa/form
app.payment.esewa.status-url=https://example.test/esewa/status
app.payment.esewa.success-url=http://localhost:4200/payment/esewa/success
app.payment.esewa.failure-url=http://localhost:4200/payment/esewa/failure
app.payment.reconciliation-minimum-age=PT5M
app.payment.reconciliation-initial-delay-ms=3600000
app.payment.reconciliation-delay-ms=3600000
app.order.expiration-age=PT30M
app.order.expiration-initial-delay-ms=3600000
app.order.expiration-delay-ms=3600000
