# Application name
spring.application.name=saman

# Local secrets may be placed in the Git-ignored project-root file
# .env.properties. Deployments should supply the same names as environment
# variables instead; the application fails closed when required secrets are absent.
spring.config.import=optional:file:.env.properties

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saman_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
# Temporary compatibility setting: controllers currently map several lazy JPA
# relationships after service transactions return. Keep this enabled until those
# mappings are moved inside explicit transaction boundaries.
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

# Redis connection (rate limiting bucket storage)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# Local file upload directory for product images
app.upload.dir=./uploads/products

# Admin bootstrap — first ADMIN account created automatically on startup IF
# no ADMIN exists yet. Leave blank to skip bootstrap (e.g. if an admin
# already exists via the old manual-SQL method). NEVER commit real
# credentials here in a real deployment — use actual environment variables,
# this file is for local dev convenience only.
app.bootstrap.admin-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# CORS — frontend origin(s) allowed to call this API. Comma-separated list;
# Spring automatically binds a comma-separated property into a List<String>.
app.cors.allowed-origins=http://localhost:4200
